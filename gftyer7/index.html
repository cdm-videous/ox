<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Video Dinamis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: #fff;
            padding: 50px;
        }
        video {
            max-width: 100%;
            width: 800px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .menu {
            margin-top: 20px;
        }
        a {
            color: #00adb5;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Pemutar Video Dinamis</h1>
    <p>Video saat ini berdasarkan parameter URL <code id="param-display">?id=</code></p>

    <!-- Elemen Video Player -->
    <video id="myVideo" controls autoplay muted>
        <source id="videoSource" src="" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <!-- Navigasi Contoh Uji Coba -->
    <div class="menu">
        <p>Coba Klik Link di Bawah Ini untuk Mengganti Video:</p>
        <a href="?id=video1">Nonton Video 1</a> | 
        <a href="?id=video2">Nonton Video 2</a> | 
        <a href="?id=video3">Nonton Video 3</a>
    </div>

    <script>
        // 1. Daftar video yang tersedia (Sesuaikan dengan file milik Anda)
        const daftarVideo = {
            "video1": "video/kucing.mp4",
            "video2": "video/pemandangan.mp4",
            "video3": "video/tutorial.mp4"
        };

        // Video default jika ID tidak ditemukan atau URL tidak pakai parameter
        const videoDefault = "video/kucing.mp4"; 

        // 2. Mengambil parameter 'id' dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id'); // Mengambil nilai dari ?id=

        // Ambil elemen HTML
        const videoElement = document.getElementById('myVideo');
        const sourceElement = document.getElementById('videoSource');
        const paramDisplay = document.getElementById('param-display');

        // 3. Logika penggantian video
        if (videoId && daftarVideo[videoId]) {
            // Jika ID ada di dalam daftar
            sourceElement.src = daftarVideo[videoId];
            paramDisplay.innerText = `?id=${videoId}`;
        } else if (videoId) {
            // Jika ID ditulis tapi tidak terdaftar, putar video default
            alert("Video tidak ditemukan! Memutar video default.");
            sourceElement.src = videoDefault;
            paramDisplay.innerText = `?id=${videoId} (Tidak Ditemukan - Diputar Default)`;
        } else {
            // Jika tidak ada parameter ?id= sama sekali
            sourceElement.src = videoDefault;
            paramDisplay.innerText = `tidak ada (Diputar Default)`;
        }

        // 4. Reload video agar sumber baru langsung diputar
        videoElement.load();
    </script>

</body>
</html>
