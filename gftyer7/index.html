<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videy - Free and Simple Video Hosting</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <!-- 🔥 DETEKSI AWAL (anti navbar muncul) -->
  <script>
    const hasVideo = new URLSearchParams(window.location.search).get("id");
    if (hasVideo) {
      document.documentElement.classList.add("watch-mode");
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0.1px; /* Mencegah margin collapse */
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      width: 100%;
      height: 100%;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }
    .logo {
      font-weight: bold;
      font-size: 20px;
    }
    .nav-right a {
      margin-left: 20px;
      text-decoration: none;
      color: #000;
    }
    .upload-btn {
      background: #111827;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
    }

    /* HERO */
    .hero {
      text-align: center;
      margin-top: 120px;
    }
    .hero h1 {
      font-size: 48px;
      margin: 0;
    }
    .hero h2 {
      font-size: 40px;
      color: #6b7280;
      margin: 0;
    }
    .hero p {
      margin-top: 20px;
      color: #6b7280;
    }
    .hero button {
      margin-top: 30px;
      padding: 12px 24px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
    }

    /* PLAYER */
    .plyr-container {
      display: none;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background: black;
    }
    .plyr-container video {
      max-width: 100%;
      max-height: 100%;
    }

    /* Sembunyikan konten utama jika dalam watch-mode */
    .watch-mode .navbar, .watch-mode .hero {
      display: none;
    }
    .watch-mode .plyr-container {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">Videy</div>
    <div class="nav-right">
      <a href="#">Terms</a>
      <a href="#" class="upload-btn">Upload</a>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <h1>Free and Simple</h1>
    <h2>Video Hosting</h2>
    <p>Upload your video and share it instantly.</p>
    <button onclick="window.location.search = '?id=example'">Coba Mode Video</button>
  </div>

  <!-- PLAYER CONTAINER -->
  <div class="plyr-container">
    <!-- 1. Menambahkan atribut 'muted' dan 'playsinline' langsung di HTML -->
    <video id="player" playsinline controls muted>
      <source src="https://googleapis.com" type="video/mp4" />
    </video>
  </div>

  <!-- Plyr JS -->
  <script src="https://plyr.io"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (document.documentElement.classList.contains("watch-mode")) {
        // 2. Mengatur opsi 'muted: true' saat inisialisasi Plyr
        const player = new Plyr('#player', {
          muted: true,
          volume: 0,
          autoplay: true // Opsional: video otomatis putar tanpa diblokir browser karena sudah di-mute
        });
      }
    });
  </script>
</body>
</html>
